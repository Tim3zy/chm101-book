<script>
// If the engine files (lib/) didn't load — e.g. index.html was opened on its own
// without the extracted folder — say so loudly instead of failing silently.
window.addEventListener('load', function () {
  setTimeout(function () {
    var guide = document.getElementById('guide');
    if (guide && !guide.innerHTML) {
      var p = document.createElement('p');
      p.setAttribute('role', 'alert');
      p.style.cssText = 'margin:18px auto 0;max-width:440px;padding:12px 16px;border:2px solid #ff5a3c;border-radius:12px;color:#f4f1e8;background:rgba(255,90,60,.10);font-size:15px;line-height:1.5';

    }
  }, 1200);
});
