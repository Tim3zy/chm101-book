<script>
'use strict';
// CHM 101 · Chapter 3: Chemical Equilibrium — the balance point of reactions
// Beat ids match content/ch03/narration.en.json.
const CHAPTER = { number: 3, title: 'Chemical Equilibrium', minutes: 18, language: 'en' };

/* ---------- book palette (style.json look.meaning) ---------- */
const NRG = '#ffb020';    // equilibrium / emphasis
const C_REACT = '#b48cff';// reactants (violet)
const C_PROD = '#39c6ff'; // products (cyan)
const C_HEAT = '#ff5a3c'; // heat / stress
const C_OK = '#7ee2a8';   // correct / go

/* ---------- small drawing helpers ---------- */
const label = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => {
  const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 });
  show(e, t0); return e;
};
const mathLine = (p, parts, x, y, t0, { size = 52, fill = COL.chalk, anchor = 'middle' } = {}) => {
  const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 });
  show(e, t0); return e;
};
// Card: rounded rect + title + body lines. Returns group.
const mkCard = (p, x, y, w, h, title, body, color, t0) => {
  const g = G(p, { o: 0, y: 18 });
  mk('rect', { x: x - w / 2, y, width: w, height: h, rx: 22, fill: '#182630', stroke: color, 'stroke-width': 3 }, g);
  mk('rect', { x: x - w / 2, y, width: w, height: 64, rx: 22, fill: color, opacity: .16 }, g);
  T(g, title, { x, y: y + 44, size: 30, fill: color, weight: 700, anchor: 'middle' });
  body.forEach((line, i) => T(g, line, { x, y: y + 96 + i * 40, size: 27, fill: COL.chalk, anchor: 'middle' }));
  show(g, t0); return g;
};
// Glowing orb: layered circles, no SVG filters (phone perf).
const orb = (p, x, y, r, color) => {
  const g = G(p, { x, y });
  mk('circle', { r: r * 1.9, fill: color, opacity: .10 }, g);
  mk('circle', { r: r * 1.4, fill: color, opacity: .16 }, g);
  mk('circle', { r, fill: color, opacity: .92 }, g);
  mk('circle', { r: r * .55, cx: -r * .22, cy: -r * .22, fill: '#fff8e8', opacity: .85 }, g);
  return g;
};
// Wavy heat arrow path (rising), drawn upward from (x, y), length L.
const heatArrow = (p, x, y, L, t0, dur = 1.4) => {
  const g = G(p, { x, y, o: 0 });
  const d = `M0,0 q14,-${L * .18} 0,-${L * .36} q-14,-${L * .18} 0,-${L * .36} q14,-${L * .18} 0,-${L * .28}`;
  const e = path(g, d, { stroke: C_HEAT, 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' }, { d: 0 });
  show(g, t0); draw(e, t0, dur * .7);
  tw(g, { y: y - 70, o: 0 }, t0 + dur * .8, dur * .7, out);
  return g;
};
// Step row: numbered badge + text, for worked examples.
const stepRow = (p, n, text, y, t0, color = NRG) => {
  const g = G(p, { x: -30, o: 0 });
  mk('circle', { cx: 150, cy: y - 12, r: 30, fill: color }, g);
  T(g, String(n), { x: 150, y: 0, size: 32, fill: '#101820', weight: 700, anchor: 'middle' });
  T(g, text, { x: 210, y, size: 33, fill: COL.chalk, weight: 500 });
  tw(g, { o: 1, x: 0 }, t0, .6, out);
  return g;
};
// Erlenmeyer flask outline with a liquid fill. Returns group.
const flask = (p, x, y, s, liquidColor, t0) => {
  const g = G(p, { x, y, o: 0, s: .6 });
  path(g, 'M-44,-150 L-44,-50 L-110,110 L110,110 L44,-50 L44,-150',
    { stroke: COL.chalk, 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  path(g, 'M-88,10 L88,10 L110,110 L-110,110 Z',
    { fill: liquidColor, opacity: .35, stroke: liquidColor, 'stroke-width': 3 });
  pop(g, t0); return g;
};
// Infinity-loop mascot with a glowing dot travelling the loop forever.
const infinityMascot = (p, x, y, s, t0, dur) => {
  const g = G(p, { x, y, s, o: 0 });
  const lp = path(g, 'M-110,0 C-110,-62 -40,-62 0,0 C40,62 110,62 110,0 C110,-62 40,-62 0,0 C-40,62 -110,62 -110,0 Z',
    { stroke: NRG, 'stroke-width': 10, fill: 'none', 'stroke-linecap': 'round' }, { d: 0 });
  const dot = mk('circle', { r: 17, fill: C_PROD }, g);
  show(g, t0); draw(lp, t0, 1.2);
  const L = lp.getTotalLength();
  prog(q => {
    const pt = lp.getPointAtLength((q % 1) * L);
    dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y);
  }, t0 + 1.2, Math.max(dur - 1.2, .1), lin);
  return g;
};
// Small molecule dot used in flows.
const mol = (p, x, y, r, color, o = .95) => mk('circle', { cx: x, cy: y, r, fill: color, opacity: o }, p);

/* ---------- beats ---------- */
const BEATS = [
['intro', 'Chemical Equilibrium', (m, D) => {
  const g = G(scene, { o: 0, y: 24 });
  T(g, 'Chapter 3 · Chemical Energetics', { x: 800, y: 300, size: 32, fill: COL.dim, anchor: 'middle' });
  show(g, .2);
  const t = T(g, 'Chemical Equilibrium', { x: 800, y: 450, size: 96, weight: 700, anchor: 'middle', fill: NRG, o: 0 });
  show(t, m('title')); pulse(t, m('title') + .5, 1.06);
  const r = T(g, 'The balance point of reactions — and how to shift it.',
    { x: 800, y: 560, size: 34, fill: COL.dim, anchor: 'middle', o: 0 });
  show(r, m('title') + .9);
  infinityMascot(g, 800, 740, 1, m('title') + .4, D - m('title'));
  // drifting equilibrium formulas behind
  [['N₂ + 3H₂ ⇌ 2NH₃', 220, 700], ['Kc = [C]ᶜ[D]ᵈ/[A]ᵃ[B]ᵇ', 1380, 700], ['Kp = Kc(RT)^Δn', 800, 800]].forEach(([s, x, y], i) => {
    const f = T(g, s, { x, y, size: 30, fill: COL.faint, anchor: 'middle', o: 0 });
    tw(f, { o: .8, y: y - 24 }, m('title') + 1.2 + i * .4, 1.2);
  });
  tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
}],

['b1', 'What is equilibrium?', (m, D) => {
  const p = panel(0);
  label(p, 'What is chemical equilibrium?', 800, 120, .2, { size: 40, fill: COL.dim, anchor: 'middle', weight: 700 });
  const { PX, PY } = axes(p, { x0: 230, y0: 700, w: 1140, h: 440, xs: [0, 10, 2], ys: [0, 1, .2],
    xl: 'time', yl: 'concentration', t0: .3 });
  // reactants curve: falls, then flattens
  const rc = path(p, `M${PX(0)},${PY(1)} Q${PX(2)},${PY(.55)} ${PX(4)},${PY(.38)} L${PX(10)},${PY(.35)}`,
    { stroke: C_REACT, 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' }, { d: 0 });
  draw(rc, m('conc'), 2.2);
  const rl = T(p, '[reactants]', { x: PX(9.4), y: PY(.5), size: 30, fill: C_REACT, anchor: 'middle', weight: 700, o: 0 });
  show(rl, m('conc') + 2.0);
  // products curve: rises, then flattens
  const pc = path(p, `M${PX(0)},${PY(0)} Q${PX(2)},${PY(.5)} ${PX(4)},${PY(.62)} L${PX(10)},${PY(.65)}`,
    { stroke: C_PROD, 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' }, { d: 0 });
  draw(pc, m('conc') + .5, 2.2);
  const pl = T(p, '[products]', { x: PX(9.4), y: PY(.8), size: 30, fill: C_PROD, anchor: 'middle', weight: 700, o: 0 });
  show(pl, m('conc') + 2.5);
  // dashed equilibrium line
  const eql = G(p, { o: 0 });
  path(eql, `M${PX(4)},${PY(0)} V${PY(1)}`, { stroke: NRG, 'stroke-width': 5, 'stroke-dasharray': '18 14' });
  T(eql, 'equilibrium', { x: PX(4), y: PY(1) - 14, size: 28, fill: NRG, anchor: 'middle', weight: 700 });
  show(eql, m('flat'));
  label(p, 'no net change in the mixture', 800, 770, m('nonet'),
    { size: 34, fill: NRG, anchor: 'middle', weight: 700 });
  // the red-underlined exam sentence
  const ng = G(p, { o: 0 });
  mk('rect', { x: 330, y: 800, width: 940, height: 80, rx: 18, fill: C_HEAT, opacity: .12, stroke: C_HEAT, 'stroke-width': 2.5 }, ng);
  T(ng, 'constant is NOT the same as equal — concentrations need not match', { x: 800, y: 850, size: 30, fill: C_HEAT, anchor: 'middle', weight: 600 });
  show(ng, m('notequal'));
  pulse(ng, m('notequal') + .3, 1.04);
}],

['b2', 'Dynamic equilibrium', (m, D) => {
  const p = panel(0);
  label(p, 'Dynamic equilibrium — nothing has stopped', 800, 120, .2,
    { size: 40, fill: COL.dim, anchor: 'middle', weight: 700 });
  // the crowded bridge: two banks and an arch
  const bg = G(p, { o: 0 });
  mk('rect', { x: 120, y: 500, width: 260, height: 300, rx: 20, fill: '#1b2831', stroke: C_REACT, 'stroke-width': 3 }, bg);
  mk('rect', { x: 1220, y: 500, width: 260, height: 300, rx: 20, fill: '#1b2831', stroke: C_PROD, 'stroke-width': 3 }, bg);
  path(bg, 'M380,580 Q800,380 1220,580', { stroke: COL.chalk, 'stroke-width': 10, fill: 'none' });
  path(bg, 'M380,640 Q800,440 1220,640', { stroke: COL.chalk, 'stroke-width': 6, fill: 'none', opacity: .6 });
  T(bg, 'reactants', { x: 250, y: 560, size: 30, fill: C_REACT, anchor: 'middle', weight: 700 });
  T(bg, 'products', { x: 1350, y: 560, size: 30, fill: C_PROD, anchor: 'middle', weight: 700 });
  show(bg, .3);
  // forward stream: violet molecules left → right along the arch
  const fDots = [];
  for (let i = 0; i < 6; i++) fDots.push(mol(p, 0, 0, 20, C_REACT, 0));
  // reverse stream: cyan molecules right → left
  const rDots = [];
  for (let i = 0; i < 6; i++) rDots.push(mol(p, 0, 0, 20, C_PROD, 0));
  const arch = t => ({ x: 380 + t * 840, y: 580 - Math.sin(t * Math.PI) * 200 });
  const t0f = m('fwd'), t0r = m('rev2');
  prog(q => {
    fDots.forEach((d, i) => {
      const t = (q + i / 6) % 1, pt = arch(t);
      d.setAttribute('cx', pt.x); d.setAttribute('cy', pt.y + 40);
      d.setAttribute('opacity', q * 1.2 > i / 6 ? .95 : 0);
    });
  }, t0f, D - t0f, lin);
  prog(q => {
    rDots.forEach((d, i) => {
      const t = 1 - (q + i / 6) % 1, pt = arch(t);
      d.setAttribute('cx', pt.x); d.setAttribute('cy', pt.y - 40);
      d.setAttribute('opacity', q * 1.2 > i / 6 ? .95 : 0);
    });
  }, t0r, D - t0r, lin);
  const fr = label(p, 'forward rate', 450, 850, m('fwd'), { size: 30, fill: C_REACT, anchor: 'middle', weight: 700 });
  const rr = label(p, 'reverse rate', 1150, 850, m('rev2'), { size: 30, fill: C_PROD, anchor: 'middle', weight: 700 });
  const eqr = G(p, { o: 0 });
  M(eqr, ['forward rate', '=', 'reverse rate'], { x: 800, y: 250, size: 44, fill: NRG, anchor: 'middle' });
  show(eqr, m('dynamic'));
  pulse(fr, m('dynamic') + .3, 1.08); pulse(rr, m('dynamic') + .5, 1.08);
  label(p, 'the crowd on each side never changes', 800, 330, m('crowd'),
    { size: 32, fill: COL.dim, anchor: 'middle' });
}],

['b3', "Equilibrium doesn't care how you arrive", (m, D) => {
  const p = panel(0);
  label(p, 'Same destination, whatever the start', 800, 120, .2,
    { size: 40, fill: COL.dim, anchor: 'middle', weight: 700 });
  label(p, 'N₂ + 3H₂ ⇌ 2NH₃', 800, 200, m('n2h2'), { size: 48, fill: NRG, anchor: 'middle', weight: 700 });
  const f1 = flask(p, 380, 560, 1, C_REACT, m('approach'));
  label(p, 'start: reactants only', 380, 760, m('approach') + .5,
    { size: 28, fill: C_REACT, anchor: 'middle', weight: 600 });
  const f2 = flask(p, 1220, 560, 1, C_PROD, m('approach') + .8);
  label(p, 'start: products only', 1220, 760, m('approach') + 1.3, { size: 28, fill: C_PROD, anchor: 'middle', weight: 600 });
  // both converge into the same mixture
  const f3 = flask(p, 800, 560, 1, NRG, m('approach') + 2.2);
  const a1 = path(p, 'M480,700 Q640,800 730,700', { stroke: C_REACT, 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round' }, { d: 0 });
  const a2 = path(p, 'M1120,700 Q960,800 870,700', { stroke: C_PROD, 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round' }, { d: 0 });
  draw(a1, m('approach') + 2.0, .8); draw(a2, m('approach') + 2.0, .8);
  label(p, 'same equilibrium mixture', 800, 830, m('approach') + 2.8,
    { size: 32, fill: NRG, anchor: 'middle', weight: 700 });
  label(p, 'thermodynamics fixes the destination · kinetics owns the speed', 800, 880, m('speed'),
    { size: 28, fill: COL.dim, anchor: 'middle' });
}],

['b4', 'Product-favored vs reactant-favored', (m, D) => {
  const p = panel(0);
  label(p, 'Not all equilibria sit in the middle', 800, 120, .2,
    { size: 40, fill: COL.dim, anchor: 'middle', weight: 700 });
  // product-favored: heavy products pan
  const b1 = balance(p, { x: 450, y: 380, L: 260 });
  show(b1.g, m('prodfav'));
  b1.load(-1, ['R'], C_REACT, m('prodfav') + .4, 40);
  b1.load(1, ['P'], C_PROD, m('prodfav') + .8, 40);
  b1.tilt(14, m('prodfav') + 1.2);
  label(p, 'product-favored', 450, 780, m('prodfav') + 1.6, { size: 34, fill: C_PROD, anchor: 'middle', weight: 700 });
  label(p, 'almost all products', 450, 830, m('prodfav') + 2.0, { size: 27, fill: COL.dim, anchor: 'middle' });
  // reactant-favored: heavy reactants pan
  const b2 = balance(p, { x: 1150, y: 380, L: 260 });
  show(b2.g, m('reactfav'));
  b2.load(-1, ['R'], C_REACT, m('reactfav') + .4, 40);
  b2.load(1, ['P'], C_PROD, m('reactfav') + .8, 40);
  b2.tilt(-14, m('reactfav') + 1.2);
  label(p, 'reactant-favored', 1150, 780, m('reactfav') + 1.6, { size: 34, fill: C_REACT, anchor: 'middle', weight: 700 });
  label(p, 'barely reacts', 1150, 830, m('reactfav') + 2.0, { size: 27, fill: COL.dim, anchor: 'middle' });
  label(p, 'which one? the energetics decide — and Kc will read it off like a dial', 800, 880, m('reactfav') + 2.6,
    { size: 28, fill: NRG, anchor: 'middle', weight: 600 });
}],

['b5', 'Catalysts', (m, D) => {
  const p = panel(0);
  label(p, 'Catalysts change the rate — never the destination', 800, 120, .2,
    { size: 40, fill: COL.dim, anchor: 'middle', weight: 700 });
  const { PX, PY } = axes(p, { x0: 260, y0: 740, w: 1080, h: 460, xs: [0, 10, 2], ys: [0, 10, 2],
    xl: 'reaction path', yl: 'energy', t0: .3 });
  // uncatalyzed hill (forward + reverse barriers)
  const hill = path(p, `M${PX(0)},${PY(3)} Q${PX(3)},${PY(2)} ${PX(5)},${PY(9)} Q${PX(7)},${PY(2)} ${PX(10)},${PY(4)}`,
    { stroke: C_REACT, 'stroke-width': 10, fill: 'none', 'stroke-linecap': 'round' }, { d: 0 });
  draw(hill, m('catrate'), 1.6);
  label(p, 'uncatalyzed', 1200, 500, m('catrate') + 1.4, { size: 28, fill: C_REACT, anchor: 'middle' });
  // catalyzed: lower hill, both barriers down equally
  const chill = path(p, `M${PX(0)},${PY(3)} Q${PX(3)},${PY(2.4)} ${PX(5)},${PY(6.4)} Q${PX(7)},${PY(2.4)} ${PX(10)},${PY(4)}`,
    { stroke: C_PROD, 'stroke-width': 10, fill: 'none', 'stroke-linecap': 'round', 'stroke-dasharray': '26 16' }, { d: 0 });
  draw(chill, m('catrate') + 1.8, 1.6);
  label(p, 'catalyzed: same start, same end', 1200, 620, m('catrate') + 3.2, { size: 28, fill: C_PROD, anchor: 'middle' });
  // barrier arrows shrink equally on both sides
  const bf = G(p, { o: 0 });
  path(bf, `M${PX(5)},${PY(3)} V${PY(9)}`, { stroke: NRG, 'stroke-width': 6 });
  T(bf, 'Ea', { x: PX(5) - 30, y: PY(6.5), size: 30, fill: NRG, anchor: 'middle', weight: 700 });
  show(bf, m('catrate') + 3.6);
  tw(bf, { o: .35 }, m('catrate') + 4.4, .5);
  const ng = G(p, { o: 0 });
  mk('rect', { x: 430, y: 796, width: 740, height: 80, rx: 18, fill: C_HEAT, opacity: .12, stroke: C_HEAT, 'stroke-width': 2.5 }, ng);
  T(ng, 'catalyst ↑ yield?  NO. Ever.', { x: 800, y: 846, size: 32, fill: C_HEAT, anchor: 'middle', weight: 700 });
  show(ng, m('catno'));
  pulse(ng, m('catno') + .3, 1.05);
}],

['b6', 'The equilibrium constant', (m, D) => {
  const p = panel(0);
  label(p, 'The number that rules this chapter', 800, 120, .2,
    { size: 40, fill: COL.dim, anchor: 'middle', weight: 700 });
  const kg = G(p, { o: 0, s: .8 });
  const fr = frac(kg, ['[C]', E('c'), '·[D]', E('d')], ['[A]', E('a'), '·[B]', E('b')], 800, 420, undefined,
    { size: 84, fill: COL.chalk, anchor: 'middle', topFill: C_PROD, botFill: C_REACT });
  T(kg, 'Kc =', { x: 800 - fr.w / 2 - 130, y: 452, size: 84, fill: NRG, anchor: 'middle', weight: 700 });
  pop(kg, m('kcdef'));
  label(p, 'aA + bB ⇌ cC + dD', 800, 620, m('kcexpr'), { size: 40, fill: COL.dim, anchor: 'middle' });
  pulse(fr.g, m('kcexpr') + .3, 1.06);
  const rules = [
    ['1 · exponents = coefficients', m('exp1'), C_PROD],
    ['2 · products over reactants', m('exp2'), NRG],
    ['3 · Kc has NO units', m('nounits'), C_OK],
  ];
  rules.forEach(([s, t0, c], i) => {
    const g = G(p, { x: -40, y: 700 + i * 80, o: 0 });
    mk('rect', { x: 380, y: -44, width: 840, height: 72, rx: 18, fill: '#1b2831', stroke: c, 'stroke-width': 3 }, g);
    T(g, s, { x: 800, y: 6, size: 34, fill: c, anchor: 'middle', weight: 700 });
    tw(g, { o: 1, x: 0 }, t0, .6, out);
  });
  pulse(kg, m('exp1') + .3, 1.05);
}],
['b7', 'Who earns a place in Kc?', (m, D) => {
  const p = panel(0);
  label(p, 'Not everything earns a place in the expression', 800, 120, .2,
    { size: 40, fill: COL.dim, anchor: 'middle', weight: 700 });
  mathLine(p, ['C(s) + CO₂(g) ⇌ 2CO(g)'], 800, 210, m('ex7'), { size: 54 });
  const sp = [['C(s)', 'solid', 380, '#8fa3ad'], ['CO₂(g)', 'gas', 800, C_PROD], ['CO(g)', 'gas', 1220, C_PROD]];
  const cards = sp.map(([name, kind, x, c], i) => {
    const g = G(p, { x, y: 380, o: 0, s: .6 });
    mk('rect', { x: -170, y: -44, width: 340, height: 150, rx: 20, fill: '#182630', stroke: c, 'stroke-width': 3 }, g);
    T(g, name, { x: 0, y: 6, size: 44, fill: c, weight: 700, anchor: 'middle' });
    T(g, kind, { x: 0, y: 56, size: 26, fill: COL.dim, anchor: 'middle' });
    pop(g, m('hetero') + i * .5); return g;
  });
  label(p, 'pure solids · pure liquids · solvents → LEFT OUT', 800, 580, m('hetero') + 1.2,
    { size: 32, fill: NRG, anchor: 'middle', weight: 700 });
  label(p, 'only gases and aqueous species go in', 800, 640, m('gasaq'),
    { size: 30, fill: C_PROD, anchor: 'middle', weight: 600 });
  // the solid card grays out and drops away
  const sg = cards[0];
  tw(sg, { y: 440, o: .25 }, m('ex7') + 1.2, .8, io);
  const x1 = path(p, 'M320,360 L440,480 M440,360 L320,480',
    { stroke: C_HEAT, 'stroke-width': 10, 'stroke-linecap': 'round' }, { d: 0 });
  draw(x1, m('ex7') + 1.8, .5);
  label(p, 'out!', 380, 560, m('ex7') + 2.0, { size: 32, fill: C_HEAT, anchor: 'middle', weight: 700 });
  pulse(cards[1], m('ex7') + 2.2, 1.06); pulse(cards[2], m('ex7') + 2.5, 1.06);
  const eg = G(p, { o: 0, y: 14 });
  mk('rect', { x: 400, y: 700, width: 800, height: 120, rx: 22, fill: '#182630', stroke: C_PROD, 'stroke-width': 3 }, eg);
  M(eg, ['Kc', '=', '[CO]', E(2), '/', '[CO₂]'], { x: 800, y: 778, size: 60, fill: C_PROD, anchor: 'middle' });
  show(eg, m('ex7') + 2.8);
  label(p, 'ask every species: gas or aqueous? if not — out', 800, 880, m('ex7') + 3.4,

['b13', 'Reading the Kc dial', (m, D) => {
  const p = panel(0);
  label(p, 'What does the size of Kc tell you?', 800, 120, .2,
    { size: 40, fill: COL.dim, anchor: 'middle', weight: 700 });
  // dial: semicircle with three zones
  const dg = G(p, { o: 0 });
  const cx = 800, cy = 700, R = 330;
  const arc3 = (a1, a2, color) => {
    const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const x2 = cx + R * Math.cos(a2), y2 = cy + R * Math.sin(a2);
    path(dg, `M${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2}`,
      { stroke: color, 'stroke-width': 56, fill: 'none', 'stroke-linecap': 'butt', opacity: .85 });
  };
  arc3(Math.PI, Math.PI * 1.33, C_REACT);   // tiny Kc: reactant-favored
  arc3(Math.PI * 1.33, Math.PI * 1.67, NRG); // Kc ≈ 1
  arc3(Math.PI * 1.67, Math.PI * 2, C_PROD); // huge Kc: product-favored
  const needle = G(dg, { x: cx, y: cy, r: -90 });
  path(needle, 'M0,0 L0,-330', { stroke: COL.chalk, 'stroke-width': 10, 'stroke-linecap': 'round' });
  mk('circle', { r: 26, fill: COL.chalk }, needle);
  show(dg, .4);
  const zn = (s, t0, color) => {
    const e = T(p, s, { x: 800, y: 820, size: 38, fill: color, anchor: 'middle', weight: 700, o: 0 });
    show(e, t0); return e;
  };
  const z1 = zn('Kc ≪ 1: reactant-favored — almost all reactants', m('small'), C_REACT);
  tw(needle, { r: -180 }, m('one'), 1.0, io);
  hide(z1, m('one'), .4);
  const z2 = zn('Kc ≈ 1: significant amounts of both', m('one'), NRG);
  tw(needle, { r: -270 }, m('big'), 1.0, io);
  hide(z2, m('big'), .4);
  zn('Kc ≫ 1: product-favored — almost all products', m('big'), C_PROD);
  // previous zone labels fade as the needle moves on
  label(p, 'a weather forecast, not a speedometer: Kc says nothing about speed', 800, 880, m('big') + 1.2,
    { size: 28, fill: COL.dim, anchor: 'middle' });
}],

  build: choice(
    [['Left, toward reactants'], ['Right, toward products'], ['It stays put']],
    0,
    'Too much product: the reaction runs backward to restore balance.',
    [null,
     'That is the Q < Kc direction.',
     'Q ≠ Kc means change is coming.']),
}], done, 'Quick check') }],
['wrap', 'To sum up', (m, D) => {
  const p = panel(0);
  label(p, 'To sum up', 800, 110, .2, { size: 40, fill: COL.dim, anchor: 'middle', weight: 700 });
  const takes = [
    ['Equilibrium: constant concentrations, forward and reverse rates equal.', 'w1', NRG],
    ['Kc uses only gases + aqueous species; exponents from coefficients.', 'w2', C_PROD],
    ['Flip → invert K · scale → raise to the power · add → multiply K.', 'w3', C_REACT],
    ['Kp = Kc(RT)^Δn, with Δn from gas moles only.', 'w4', NRG],
    ['Q vs K predicts the direction of shift.', 'w5', C_PROD],
    ['ICE tables solve every concentration problem — check the 5%.', 'w6', C_OK],
    ['Le Chatelier: the system minimizes the stress.', 'w7', C_HEAT],
  ];
  takes.forEach(([str, mark, color], i) => {
    const g = G(p, { x: -24, y: 240 + i * 100, o: 0 });
    mk('circle', { cx: 170, cy: -11, r: 28, fill: color }, g);
    T(g, String(i + 1), { x: 170, y: 0, size: 30, fill: '#101820', weight: 700, anchor: 'middle' });
    T(g, str, { x: 230, y: 0, size: 32, weight: 600 });
    tw(g, { o: 1, x: 0 }, m(mark), .6, out);
  });
  infinityMascot(p, 1450, 780, .5, m('w7'), D - m('w7'));
}],

['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [
  { id: 'p-expr', prompt: ['Write Kc for: 2SO₂(g) + O₂(g) ⇌ 2SO₃(g).'],
    build: choice(
      [['[SO₃]²/([SO₂]²[O₂])'], ['[SO₂]²[O₂]/[SO₃]²'], ['[SO₃]/([SO₂][O₂])']],
      0,
      'Products over reactants, exponents from coefficients.',
      [null,
       'That is reactants over products — upside down.',
       'The coefficients 2, 1, 2 must appear as exponents.']) },
  { id: 'p-kcrev', prompt: ['For A ⇌ B, Kc = 4.0. What is Kc′ for 2B ⇌ 2A?'],
    build: blanks([{ parts: ['Kc′ = ', { box: '0.0625' }],
      why: 'Reverse and double: (1/4.0)² = 1/16 = 0.0625.',
      hint: 'Reverse → invert; double → square.' }]) },
  { id: 'p-kpdn', prompt: ['For H₂(g) + I₂(g) ⇌ 2HI(g), the relation between Kp and Kc is:'],
    build: choice(
      [['Kp = Kc'], ['Kp = Kc(RT)'], ['Kp = Kc/(RT)']],
      0,
      'Δn = 2 − 2 = 0, so (RT)⁰ = 1.',
      [null,
       'That needs Δn = +1.',
       'That needs Δn = −1.']) },
  { id: 'p-qdir', prompt: ['For N₂+3H₂ ⇌ 2NH₃ (Kc = 0.50): [N₂]=0.10, [H₂]=0.10, [NH₃]=0.010. Which way?'],
    build: choice(
      [['Left'], ['Right'], ['At equilibrium']],
      0,
      'Q = (0.010)²/(0.10×0.10³) = 1.0 > Kc = 0.50: too much product, shift left.',
      [null,
       'That needs Q < Kc.',
       'Q = 1.0 ≠ 0.50, so change is coming.']) },
  { id: 'p-ice', prompt: ['A ⇌ 2B, Kc = 1.2. Initially [A] = 0.50 M, [B] = 0. What is [B] at equilibrium?'],
    build: blanks([{ parts: ['[B] = ', { box: '0.531' }, ' M'],
      why: 'ICE: (2x)²/(0.50−x) = 1.2 → x = 0.265, so [B] = 2x = 0.531 M.',
      hint: 'Let the change be x; [B] rises by 2x.' }]) },
  { id: 'p-lechatt', prompt: ['N₂+3H₂ ⇌ 2NH₃, ΔH = −92.2 kJ. Raising the temperature:'],
    build: choice(
      [['Shifts left — less NH₃'], ['Shifts right — more NH₃'], ['No effect']],
      0,
      'Exothermic: heat is a product; adding heat shifts the equilibrium left.',
      [null,
       'That is the endothermic direction.',
       'Temperature is the one stress that always shifts equilibrium.']) },
  { id: 'p-lechatp', prompt: ['For H₂ + I₂ ⇌ 2HI, increasing the pressure:'],
    build: choice(
      [['No shift'], ['Shifts right'], ['Shifts left']],
      0,
      'Equal gas moles both sides (2 = 2): pressure is powerless.',
      [null,
       'That needs fewer gas moles on the right.',
       'That needs fewer gas moles on the left.']) },
  { id: 'p-kcmean', prompt: ['Kc = 3.5×10⁸ for a reaction. At equilibrium the mixture is:'],
    build: choice(
      [['Almost all products'], ['Almost all reactants'], ['Roughly equal amounts']],
      0,
      'Very large Kc: strongly product-favored.',
      [null,
       'That is a very small Kc.',
       'That is Kc near 1.']) },
], done, 'Chapter practice') }],

['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
